<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141416"><title>Quick Shot</title><style>
/* =====================================================================
   Quick Shot — charcoal arcade presentation
   One consolidated stylesheet. Board spaces are sized from the space
   available (container query units), so the same board scales from a
   phone up to a TV without layout overrides fighting each other.
   ===================================================================== */
:root{
  --bg:#0b0b0d;--panel:#1e1e21;--panel-hi:#26262a;--line:#3d3d44;--line-soft:#ffffff14;
  --text:#f5f5f5;--muted:#b6b6bd;--gold:#ffd873;--gold-deep:#e9b23f;--green:#1d9a55;--red:#bd2b3d;
  --radius:14px;--ease-out:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);
  -webkit-text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse 120% 70% at 50% -20%,#34343a 0%,#151518 48%,#09090b 100%) fixed}
h1,h2,h3{line-height:1.15}
.hidden{display:none!important}
.held{display:none!important}
.veiled{visibility:hidden}
.muted{color:var(--muted)}

/* ---------- header ---------- */
header{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;min-height:52px;background:linear-gradient(#1b1b1e,#141416);border-bottom:1px solid var(--line);box-shadow:0 4px 18px #0007}
header h1{margin:0;font-size:clamp(17px,2.2vw,23px);font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
#identity{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:.04em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#identity .token{font-size:20px}
main{padding:16px;max-width:1650px;margin:0 auto}
#error{color:#ff8b9a;min-height:22px;font-weight:700}
#error:empty{min-height:0}

/* ---------- panels & controls ---------- */
.panel{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:0 10px 28px #0006,inset 0 1px 0 var(--line-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{font:inherit;border-radius:10px;padding:11px 15px;border:1px solid #66666e}
button{background:linear-gradient(#f4f4f4,#dcdcdc);color:#111;font-weight:800;letter-spacing:.02em;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 2px 0 #0006,inset 0 1px 0 #fff8;transition:transform .12s var(--ease-out),filter .15s,box-shadow .15s}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(1.08)}}
button:active:not(:disabled){transform:translateY(1px) scale(.98);box-shadow:0 1px 0 #0006}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.alt{background:linear-gradient(#45454c,#38383e);color:#fff;border-color:#5c5c64;box-shadow:0 2px 0 #0006,inset 0 1px 0 #ffffff1a}
button.danger{background:linear-gradient(#c3354a,#9e2435);color:#fff;border-color:#de5a6c;box-shadow:0 2px 0 #0006,inset 0 1px 0 #ffffff26}
button.primary{background:linear-gradient(#ffe697,#f0be47);color:#1d1504;border-color:#ffefb8}
button.good{background:linear-gradient(#27b064,#1a8a4c);color:#fff;border-color:#4fd88c;box-shadow:0 2px 0 #0006,inset 0 1px 0 #ffffff30}
button.big{font-size:clamp(20px,2.4vw,26px);padding:18px 34px}
input,select{background:#111113;color:#fff;border-color:#55555d}
input[type=file]{max-width:100%;padding:9px}
input::placeholder{color:#8a8a92}

/* ---------- entry screen ---------- */
#entry{max-width:760px;margin:6vh auto 0;text-align:center;padding:clamp(18px,4vw,34px)}
#entry h2{margin:0 0 18px;font-size:clamp(20px,3vw,28px)}
#entry>.row{justify-content:center;gap:14px}
#entry>.row button{flex:1 1 200px;max-width:280px}
#hostEntry,#playerEntry{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
#hostEntry h3,#playerEntry h3{margin:0 0 12px}
#playerEntry .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#playerEntry .row #join{grid-column:1/-1}
#code{text-align:center;font-weight:900;letter-spacing:.25em}
@media (max-width:480px){#playerEntry .row{grid-template-columns:1fr}}

/* ---------- room / setup ---------- */
#setupToggleWrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#setupToggleWrap button{padding:7px 12px;font-size:13px}
#openAnswerMonitorTop{margin-left:auto}
.roomSection{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap}
.roomCodeBig{font-size:clamp(28px,4vw,46px);font-weight:950;letter-spacing:.08em;color:var(--gold);text-shadow:0 2px 0 #0008,0 0 24px #e9b23f40}
#status{font-weight:700;letter-spacing:.04em}
#hostSetup p{margin:12px 0 10px;color:var(--muted)}
#uploadInfo{white-space:pre-wrap;margin-top:10px;font-weight:700}

/* ---------- player chips ---------- */
.playerBoardHeader{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.playerBoardHeader h2{margin:0;font-size:18px}
.playerBoardHeader h2 small{font-size:.75em;font-weight:600}
.boardZoomControls{display:flex;gap:5px;align-items:center}
body:not(.hostMode) .boardZoomControls{display:none}
.boardStatus{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.player{display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 6px;background:#2f2f34;border:1px solid #4e4e56;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .15s}
.player .token{font-size:17px;width:20px;height:20px}
.player.isMe{border-color:var(--gold);box-shadow:0 0 0 1px #ffd87355}
.player .pName{max-width:13ch;overflow:hidden;text-overflow:ellipsis}
.player .pPos{font-variant-numeric:tabular-nums;background:#0006;border-radius:999px;padding:1px 8px;color:var(--gold);font-weight:900}
.player .pPos small{color:var(--muted);font-weight:700}
.player .conn{width:8px;height:8px;border-radius:50%;background:#6c6c74;flex:0 0 auto}
.player .conn.on{background:#3fd27f;box-shadow:0 0 6px #3fd27f}
.player button.danger{padding:3px 9px;font-size:12px;border-radius:999px;margin-left:2px}

/* ---------- banners ---------- */
.landedBanner{font-size:clamp(16px,2vw,24px);font-weight:900;text-align:center;background:linear-gradient(#3d3218,#2c2412);border:2px solid var(--gold);color:#fff;border-radius:999px;padding:10px 22px;margin:10px auto;box-shadow:0 6px 24px #000a,0 0 22px #e9b23f40;animation:bannerIn .45s var(--ease-out) both}
.piggyNotice{background:linear-gradient(#c43a8c,#9c2370);color:#fff;border:2px solid #ff9dd5;border-radius:999px;text-align:center;font-weight:900;font-size:clamp(15px,1.8vw,22px);padding:9px 20px;margin:6px auto;box-shadow:0 6px 22px #000a,0 0 20px #fa4db855;animation:bannerIn .45s .12s var(--ease-out) both}
.notice{color:#ffd56d;font-weight:700}
.notice:empty{display:none}

/* =====================================================================
   BOARD
   --cell drives every measurement inside a space. app.js sets it from
   the board's measured size (ResizeObserver), so spaces fill the space
   available on any screen.
   ===================================================================== */
.board{position:relative;display:flex;align-items:center;gap:clamp(6px,.9vh,12px);overflow-x:auto;overflow-y:hidden;padding:10px 12px;height:clamp(150px,26vh,260px);
  --cell:150px;
  scrollbar-width:thin;scrollbar-color:#55555d transparent;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{height:8px}.board::-webkit-scrollbar-thumb{background:#4a4a52;border-radius:8px}
.space{position:relative;flex:0 0 var(--cell);width:var(--cell);height:var(--cell);
  border:calc(var(--cell)*.022 + 1.5px) solid #ffffffb8;border-radius:calc(var(--cell)*.1);padding:calc(var(--cell)*.06);
  color:#141414;text-align:center;font-weight:900;display:flex;flex-direction:column;
  box-shadow:inset 0 calc(var(--cell)*.035) 0 #ffffff38,inset 0 calc(var(--cell)*-.04) 0 #00000026,0 calc(var(--cell)*.03) calc(var(--cell)*.07) #000a;
  transition:transform .3s var(--ease-out),box-shadow .3s}
.space .spaceNum{position:absolute;top:calc(var(--cell)*.05);left:calc(var(--cell)*.05);z-index:1;font-size:calc(var(--cell)*.095 + 2px);line-height:1;font-weight:900;padding:calc(var(--cell)*.018) calc(var(--cell)*.04);border-radius:calc(var(--cell)*.045);background:#00000030;color:inherit;font-variant-numeric:tabular-nums}
.space .spaceName{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--cell)*.02);font-size:calc(var(--cell)*.125);font-weight:950;line-height:1.05;letter-spacing:-.01em;padding-bottom:calc(var(--cell)*.12)}
.spaceSymbol{font-size:calc(var(--cell)*.34);line-height:1;filter:drop-shadow(0 2px 2px #0005)}
.startArrow{font-size:calc(var(--cell)*.24);line-height:1}
.space[data-type="Start"]{background:linear-gradient(160deg,#a2a2a8,#76767c)!important;color:#111!important}
.space[data-type="Start"] .spaceName{padding-bottom:calc(var(--cell)*.14)}
.space[data-type="Hint"]{background:#50c878!important;color:#102a18!important}
.space[data-type="Add 2"] .spaceSymbol,.space[data-type="Add 3"] .spaceSymbol{font-weight:950;letter-spacing:-.04em;text-shadow:0 2px 0 #0003;filter:none}
.space[data-type="Goal"]{border-color:#fff;background-size:calc(var(--cell)*.25) calc(var(--cell)*.25)!important;box-shadow:0 0 calc(var(--cell)*.12) #ffffff70,0 calc(var(--cell)*.03) calc(var(--cell)*.07) #000a}
.space[data-type="Goal"] .spaceName{color:#fff!important;font-size:calc(var(--cell)*.2);letter-spacing:.06em;text-shadow:0 2px 0 #000,0 0 6px #000,0 0 14px #000}
.secretSymbol{filter:drop-shadow(0 0 calc(var(--cell)*.05) #fff) drop-shadow(0 2px 2px #0006);animation:secretGlow 2.6s ease-in-out infinite}
/* Double: static gold; only cheap transform/opacity sparkles animate. */
.space[data-type="Double"]{background:linear-gradient(135deg,#fff4ad 0%,#f8d24c 22%,#a86a09 50%,#ffe882 76%,#b8780b 100%)!important;border-color:#ffed8a;box-shadow:0 0 calc(var(--cell)*.13) #ffcc4080,inset 0 0 calc(var(--cell)*.07) #fff6a7,0 calc(var(--cell)*.03) calc(var(--cell)*.07) #000a}
.space[data-type="Double"] .spaceSymbol{font-weight:950;text-shadow:0 2px 3px #fff8;filter:none}
.space[data-type="Double"]::after,.space[data-type="Double"]::before{position:absolute;color:#fff;pointer-events:none;will-change:transform,opacity}
.space[data-type="Double"]::after{content:'✦';right:9%;top:6%;font-size:calc(var(--cell)*.13);text-shadow:0 0 8px #fff,0 0 13px #ffe45e;animation:twinkle 1.6s ease-in-out infinite alternate}
.space[data-type="Double"]::before{content:'✧';left:17%;bottom:16%;font-size:calc(var(--cell)*.11);text-shadow:0 0 10px #fff;animation:twinkle 2.2s .6s ease-in-out infinite alternate}

/* tokens sit in a strip along the bottom of each space */
.space .tokens{position:absolute;left:calc(var(--cell)*.04);right:calc(var(--cell)*.04);bottom:calc(var(--cell)*.045);z-index:2;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-items:center;gap:0 calc(var(--cell)*.01)}
.token{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;font-size:19px;line-height:1;-webkit-text-stroke:.6px #1a1a1a;filter:drop-shadow(0 1px 1px #000) drop-shadow(0 0 2px #0009)}
.space .token{width:calc(var(--cell)*.19);height:calc(var(--cell)*.19);font-size:calc(var(--cell)*.18)}
.space .tokens:has(.token:nth-child(6)) .token{width:calc(var(--cell)*.165);height:calc(var(--cell)*.165);font-size:calc(var(--cell)*.15)}

/* landing / movement */
.space.landing{z-index:3;outline:calc(var(--cell)*.03 + 2px) solid #fff2a0;outline-offset:3px;box-shadow:0 0 calc(var(--cell)*.18) #ffdb66,0 0 calc(var(--cell)*.36) #ffd85e66;animation:landingPop .55s var(--ease-out)}
.moveGhost{position:absolute;left:0;top:0;z-index:8;pointer-events:none;will-change:transform;transform:translate(-9999px,0)}
.moveGhost .token{width:calc(var(--cell)*.3);height:calc(var(--cell)*.3);font-size:calc(var(--cell)*.27);-webkit-text-stroke:1px #111;filter:drop-shadow(0 4px 4px #000c) drop-shadow(0 0 6px #fff9)}
.moveGhost.rider .token{width:calc(var(--cell)*.24);height:calc(var(--cell)*.24);font-size:calc(var(--cell)*.21)}
.swapFlash{animation:swapFlash .7s ease-in-out 3;z-index:4}

/* host overview: whole board laid out as a serpentine grid */
.board.boardOverview{display:grid;grid-template-columns:repeat(var(--ov-cols,13),var(--cell));grid-auto-rows:var(--cell);gap:6px;justify-content:center;align-content:center;overflow:hidden}
.board.boardOverview .space{width:var(--cell);height:var(--cell)}
body.hostMode #board.board.boardOverview{padding:66px 8px 8px}

/* ---------- question / answer ---------- */
.question{font-size:clamp(21px,3vw,40px);font-weight:850;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
#qid{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.questionImage{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:16px auto 6px;border-radius:12px;border:1px solid #555;background:#141416;box-shadow:0 8px 24px #0008}
.answer{background:linear-gradient(#1c6b4b,#14553a);border:1px solid #3fae7c;padding:14px 18px;border-radius:12px;font-size:clamp(26px,3.5vw,46px);font-weight:950;line-height:1.2;text-align:center;overflow-wrap:anywhere;box-shadow:0 8px 26px #0009,inset 0 1px 0 #ffffff26}
#answer:not(.hidden){margin-top:16px;animation:revealIn .5s var(--ease-out) both}
.revealHint{font-size:clamp(15px,2.2dvh,23px);color:#bce4c2;text-align:center;padding:8px;white-space:pre-wrap;animation:fadeIn .5s .2s both}
#clock{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
#clock:empty{display:none}
#queue p{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding:8px 12px;border-radius:10px;background:#2b2b30;border:1px solid #44444b;font-weight:700;animation:slideIn .3s var(--ease-out) both}
#queue p .token{font-size:20px}
.buzzTime{font-size:13px;color:#ffdf91;margin-left:auto;font-variant-numeric:tabular-nums}
.strike{text-decoration:line-through;opacity:.5}
#queue p.active{border-color:var(--gold);background:linear-gradient(90deg,#5c4c29,#2b2b30);box-shadow:0 0 16px #e9b23f40}
.queuePanel h3{margin:0 0 10px}

/* ---------- dice ---------- */
#rollWrap{text-align:center}
.die{display:inline-block;font-size:100px;line-height:1;filter:drop-shadow(0 0 16px #fff5)}
.die.rolling{animation:diceShake .13s linear infinite}
.die.dieLanded{animation:diePop .4s var(--ease-out)}
#rollInfo{font-size:clamp(18px,2.6vw,32px);font-weight:900;color:#ffe18d;text-shadow:0 2px 5px #000;animation:fadeIn .3s both}

/* ---------- choices ---------- */
#choiceTitle{margin:0 0 12px}
.targetChoice{display:inline-flex;align-items:center;gap:9px;padding:12px 16px}
.selectedTarget{outline:3px solid #67e9a4;outline-offset:2px}
.swapConfirm{width:100%;padding:14px;border:2px solid #67e9a4;border-radius:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-weight:800;background:#16382699;animation:fadeIn .25s both}
.swapConfirm button{background:linear-gradient(#2fb36e,#20894f);color:#fff;border-color:#67e9a4}

/* ---------- player action tray ---------- */
.abilityTray{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.abilityTray:empty{display:none}
.abilityIcon{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;border:2px solid #bbb;background:#303033;color:#fff;font-size:26px;font-weight:950;box-shadow:0 3px 10px #0008;animation:popIn .35s var(--ease-out) both}
.abilityAdd3,.abilityAdd2,.abilityDouble{font-size:22px}
.abilityHint{background:#168d49}.abilityLockedOut{background:#a72b36}.abilityDouble{background:#d6a92b;color:#111}.abilityPiggyBack{background:#ac6983}
.hintAction{display:flex;align-items:center;justify-content:center}
.hintAction:empty{min-height:0}
.hintAction button{background:linear-gradient(#3f9c61,#2c7a4a);color:#fff;border-color:#6fd394;padding:7px 24px;animation:popIn .3s var(--ease-out) both}
.buzzerLocked{background:linear-gradient(#cf3348,#a6212f)!important;color:#fff!important;opacity:1!important;border-color:#ee6676!important}
.buzzerReady{background:linear-gradient(#22b062,#16874a)!important;color:#fff!important;opacity:1!important;border-color:#5fe39a!important;box-shadow:0 5px 0 #0b4f2a,0 0 28px #2ad37a66!important}
#buzzButton{transition:background .15s,box-shadow .15s,transform .08s}
#buzzButton.buzzerReady:active{transform:translateY(4px);box-shadow:0 1px 0 #0b4f2a,0 0 18px #2ad37a55!important}
#privateHint:not(.hidden){margin-top:8px;font-size:clamp(17px,2.4vh,24px);animation:revealIn .4s both}

/* ---------- host controls ---------- */
.controls{position:sticky;bottom:0;z-index:4;display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:linear-gradient(#141416,#0e0e10);border-top:1px solid #4a4a52;box-shadow:0 -6px 22px #0009}
.controls button{min-height:46px;font-size:16px;padding:10px 20px}

/* ---------- winner / overlays ---------- */
.winner{font-size:46px;text-align:center;color:#ffe080;font-weight:950}
#winner:not(.hidden){position:fixed;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left));background:radial-gradient(ellipse at center,#000000d0 0%,#000000ee 70%);font-size:clamp(30px,6vw,76px);line-height:1.15;color:#ffe28a;text-shadow:0 3px 5px #000,0 0 40px #e7b44c;overflow-wrap:anywhere;pointer-events:none;animation:victoryPop .6s var(--ease-out) both}
.confettiPiece{position:fixed;top:-30px;pointer-events:none;z-index:1150;will-change:transform,opacity;animation:confettiFall var(--duration) linear forwards}

.swapAnnouncement{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:100;background:#151517f2;border:3px solid #f4d579;color:#fff;padding:22px 36px;border-radius:18px;font-size:clamp(21px,3vw,40px);font-weight:950;text-align:center;box-shadow:0 0 70px #f7ce5b88,0 16px 50px #000c;animation:popDown .4s var(--ease-out) both;pointer-events:none}
.piggySelectionPopup{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:9999;max-width:min(90vw,650px);padding:22px 32px;border:3px solid #ffcc70;border-radius:18px;background:linear-gradient(#45294f,#2d1b35);color:#fff3d2;text-align:center;font-size:clamp(22px,3.5vw,38px);font-weight:900;box-shadow:0 12px 45px #000b;pointer-events:none;animation:popDown .35s var(--ease-out) both}
.questionStatusNotice{position:fixed;z-index:850;left:50%;top:19%;transform:translateX(-50%);width:min(92vw,540px);padding:16px 22px;border-radius:16px;text-align:center;font-size:clamp(18px,5vw,28px);font-weight:950;letter-spacing:.025em;box-shadow:0 10px 34px #000b;pointer-events:none;animation:popDown .35s var(--ease-out) both}
.questionStatusNotice.locked{background:#991f2e;color:#fff;border:3px solid #ff6878}
.questionStatusNotice.solo{background:#58298d;color:#fff;border:3px solid #b887ff}
.questionStatusNotice.head{background:#16683e;color:#edfff3;border:3px solid #79ef9c}
.hintUsedPopup{position:fixed;z-index:900;top:16%;left:50%;transform:translateX(-50%);width:min(88vw,510px);background:#b4eeb6;color:#124f29;border:3px solid #4dba6b;border-radius:16px;padding:20px 26px;font-weight:950;font-size:clamp(20px,3vw,29px);text-align:center;box-shadow:0 10px 35px #000a;pointer-events:none;animation:popDown .35s var(--ease-out) both}
.secretFoundPopup{position:fixed;top:22%;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:min(92vw,650px);padding:32px 22px;border:5px solid #ffe58b;border-radius:24px;background:linear-gradient(145deg,#245a36,#102e1c);color:#fff;box-shadow:0 0 0 7px #0008,0 16px 70px #000e,0 0 38px #ffdf6c99;pointer-events:none;animation:secretPop .45s var(--ease-out) both}
.secretFoundPopup strong{font-size:clamp(25px,5vw,48px);line-height:1.15;text-shadow:0 3px 8px #000}
.secretFoundPopup>span:last-child{font-size:clamp(25px,4.5vw,43px);font-weight:1000;color:#ffe47a}
.secretFoundIcon{font-size:clamp(38px,7vw,70px);animation:wiggle .6s .3s ease-in-out 2}
/* every popup fades out instead of vanishing */
.leaving{animation:popOut .26s ease-in forwards!important}

/* ---------- leaderboard ---------- */
#leaderboard{position:fixed;inset:0;z-index:1200;background:#0b0b0d;padding:clamp(10px,2vw,28px);display:flex;flex-direction:column;gap:12px;color:#fff;animation:fadeIn .35s both}
#leaderboard h2{margin:0;font-size:clamp(24px,4vw,42px);color:#ffe08a;text-shadow:0 0 24px #e9b23f55}
#leaderboard .leaderTop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- keyframes (transform / opacity only where it loops) ---------- */
@keyframes twinkle{from{opacity:.25;transform:scale(.7) rotate(-10deg)}to{opacity:1;transform:scale(1.35) rotate(15deg)}}

@keyframes landingPop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}

@keyframes popDown{from{opacity:0;transform:translate(-50%,-20px) scale(.92)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes popOut{to{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
@keyframes secretPop{from{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.04);opacity:1}to{transform:translateX(-50%) scale(1)}}
@keyframes wiggle{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes victoryPop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes revealIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
body.hostMode #landed,body.hostMode #piggyNotice{--bx:-50%}

@media (prefers-reduced-motion:reduce){
  .space[data-type="Double"]::after,.space[data-type="Double"]::before,.secretSymbol{animation:none}

}
