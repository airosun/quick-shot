<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia Race</title><style>
:root{font-family:system-ui,Arial;color:#f6f7ff;background:#101524}*{box-sizing:border-box}body{margin:0}header{background:#1b2338;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:24px}main{padding:20px;max-width:1450px;margin:auto}.panel{background:#1c263c;border:1px solid #35415d;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #4c5a78}button{background:#586bfa;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.35;cursor:default}button.alt{background:#37445f}button.danger{background:#a73749}input,select{background:#11192a;color:white}input[type=file]{max-width:100%}.muted{color:#b2bfd8}.board{display:flex;gap:7px;overflow-x:auto;padding:14px 4px 20px;scroll-behavior:smooth}.space{flex:0 0 102px;width:102px;height:114px;border:2px solid #78829a;border-radius:8px;padding:5px;color:#111;text-align:center;font-weight:800;font-size:13px;position:relative;display:flex;flex-direction:column;justify-content:space-between}.space small{align-self:flex-start}.tokens{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}.token{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;font-size:19px;text-shadow:0 1px 2px #222;-webkit-text-stroke:.5px #333;filter:drop-shadow(0 0 1px black)}.players{display:flex;gap:10px;flex-wrap:wrap}.player{padding:9px;background:#283550;border-radius:8px}.question{font-size:clamp(21px,3vw,36px);font-weight:800}.answer{background:#17563f;padding:15px;border-radius:8px}.queue{min-width:210px;flex:1}.strike{text-decoration:line-through;opacity:.55}.active{outline:2px solid #f6c44b}.controls{position:sticky;bottom:0;background:#141d31;border-top:1px solid #475571;padding:12px;display:flex;gap:9px;flex-wrap:wrap;z-index:4}.hidden{display:none!important}.big{font-size:26px;padding:20px 35px}.die{font-size:80px;text-align:center}.notice{color:#ffd56d}.winner{font-size:46px;text-align:center;color:#ffe080}.overlay{display:flex;gap:15px;align-items:stretch;flex-wrap:wrap}.overlay>.panel:first-child{flex:3;min-width:260px}.overlay>.panel:last-child{flex:1}.topToken{font-size:30px}#error{color:#ff8998;min-height:24px}#clock{font-size:25px;font-weight:bold} @media(max-width:600px){main{padding:10px}.space{flex-basis:85px;width:85px}.controls button{padding:9px}}
</style></head><body><header><h1>🎲 Trivia Race</h1><span id="identity"></span></header><main><div id="error"></div><section id="entry" class="panel"><h2>Play online</h2><div class="row"><button id="create">Create Host Lobby</button></div><h3>Join a game</h3><div class="row"><input id="code" placeholder="Lobby code" maxlength="5"><input id="name" placeholder="Player name" maxlength="24"><select id="color"></select><select id="shape"></select><button id="join">Join Lobby</button></div></section><section id="game" class="hidden"><div class="panel"><div class="row"><strong id="room"></strong><span id="status" class="muted"></span><span id="me"></span></div><div id="players" class="players"></div><div id="hostSetup" class="hidden"><p>Upload an Excel file with row 1 as headers and columns A: ID, B: Question, C: Answer, D: Hint.</p><input type="file" id="file" accept=".xlsx,.xls"><span id="uploadInfo"></span></div></div><div id="boardWrap" class="panel"><h2>Game Board <small class="muted">Scroll horizontally →</small></h2><div id="board" class="board"></div></div><div id="questionWrap" class="overlay hidden"><div class="panel"><div class="muted" id="qid"></div><div class="question" id="question"></div><div id="answer" class="answer hidden"></div><div id="clock"></div></div><div class="panel"><h3>Buzz queue</h3><div id="queue"></div></div></div><div id="rollWrap" class="panel hidden"><div class="die" id="die">🎲</div><div id="rollInfo" style="text-align:center"></div></div><div id="choiceWrap" class="panel hidden"><h3 id="choiceTitle"></h3><div id="targets" class="row"></div></div><div id="winner" class="winner hidden"></div><div id="notice" class="notice"></div><div id="playerActions" class="panel hidden"><div class="row" id="actions"></div><div id="privateHint" class="answer hidden"></div></div><div id="hostControls" class="controls hidden"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
