</style></head><body><header><h1>🎯 Quick Shot</h1><span id="identity"></span></header><main><div id="error"></div><section id="entry" class="panel"><h2>Choose how to play</h2><div class="row"><button id="hostOption" class="big">HOST</button><button id="playerOption" class="big alt">PLAYER</button></div><div id="hostEntry" class="hidden"><h3>Host a game</h3><button id="create">Create Host Lobby</button></div><div id="playerEntry" class="hidden"><h3>Join a game</h3><div class="row"><input id="code" placeholder="Lobby code" maxlength="5" autocapitalize="characters" autocomplete="off" spellcheck="false" style="text-transform:uppercase"><input id="name" placeholder="Player name" maxlength="12"><select id="color"></select><select id="shape"></select><button id="join">Join Lobby</button></div></div></section><section id="game" class="hidden"><div id="setupToggleWrap" class="setupToggle hidden"><button id="toggleRoom" class="alt">Hide Room & Question Set</button><button id="openAnswerMonitorTop" class="alt">OPEN ANSWER MONITOR</button><button id="openQuestionLog" class="alt">OPEN QUESTION LOG</button></div><div id="setupPanel" class="panel"><div class="roomSection"><strong id="room" class="roomCodeBig"></strong><span id="status" class="muted"></span></div><div id="hostSetup" class="hidden"><p>Upload an Excel file with row 1 as headers and columns A: ID, B: Question, C: Answer, D: Hint, E: Images (optional image URL).</p><input type="file" id="file" accept=".xlsx,.xls"><div id="uploadInfo" role="status" style="white-space:pre-wrap;margin-top:10px"></div></div></div><div id="boardWrap" class="panel"><div class="playerBoardHeader"><h2>Game Board <small class="muted">Scroll horizontally →</small></h2><div id="boardZoomControls" class="boardZoomControls"><button id="zoomOut" type="button" class="alt">− Zoom Out</button><button id="zoomIn" type="button" class="alt">+ Zoom In</button></div><div id="players" class="boardStatus"></div></div><div id="landed" class="landedBanner hidden"></div><div id="piggyNotice" class="piggyNotice hidden"></div><div id="board" class="board"></div></div><div id="questionWrap" class="overlay hidden"><div class="panel"><div class="muted" id="qid"></div><div class="question" id="question"></div><img id="questionImage" class="questionImage hidden" alt="Question image" referrerpolicy="no-referrer"><div id="answer" class="answer hidden"></div><div id="revealHint" class="revealHint hidden"></div><div id="clock"></div></div><div class="panel"><h3>Buzz queue</h3><div id="queue"></div></div></div><div id="rollWrap" class="panel hidden"><div class="die" id="die">🎲</div><div id="rollInfo" style="text-align:center"></div></div><div id="choiceWrap" class="panel hidden"><h3 id="choiceTitle"></h3><div id="targets" class="row"></div></div><div id="winner" class="winner hidden"></div><button id="leaderReopen" class="alt hidden" type="button">🏆 View Final Leaderboard</button><section id="leaderboard" class="hidden" aria-label="Final leaderboard"><div class="leaderTop"><h2>🏆 FINAL LEADERBOARD</h2><button id="leaderClose" class="leaderClose">Close</button></div><div class="leaderScroll"><table><thead id="leaderHead"></thead><tbody id="leaderBody"></tbody></table></div></section><div id="notice" class="notice"></div><div id="questionStatusNotice" class="questionStatusNotice hidden" role="status"></div><div id="playerActions" class="panel hidden"><div id="hintAction" class="hintAction"></div><div class="row" id="actions"></div><div id="abilityTray" class="abilityTray" aria-label="Active abilities"></div><div id="privateHint" class="answer hidden"></div></div><div id="hostControls" class="controls hidden"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
