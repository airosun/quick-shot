<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Shot — Question Log</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:16px;background:#121215;color:#f5f5f5;font:15px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(19px,3vw,28px);margin:0 0 14px}#status{color:#b4b4b4}.scroll{overflow:auto;max-height:calc(100dvh - 95px);border:1px solid #555;border-radius:9px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:max-content}th,td{padding:11px;border-bottom:1px solid #555;border-right:1px solid #333;text-align:center;white-space:nowrap}th{position:sticky;top:0;background:#303038;z-index:2}td.question,td.answer{white-space:normal;text-align:left;min-width:180px;max-width:450px}td.yes{background:#246d3c;color:#fff;font-weight:800}td.no{background:#8d3030;color:#fff;font-weight:800}td:first-child{font-weight:800}#empty{padding:18px;color:#aaa}</style></head><body><header><h1>📋 Quick Shot — Question Log</h1><span id="status">Connecting…</span></header><div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table><p id="empty">Questions will appear here as they are used.</p></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({autoConnect:false});let credentials=null;const $=id=>document.getElementById(id);function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(data){const players=data.players||[],entries=data.entries||[];$('head').innerHTML='<tr><th>Q#</th><th>Question</th><th>Answer</th>'+players.map(p=>'<th>'+escapeHtml(p.name)+'</th>').join('')+'</tr>';$('body').innerHTML=entries.map(q=>'<tr><td>'+q.number+'</td><td class="question">'+escapeHtml(q.question)+'</td><td class="answer">'+escapeHtml(q.answer)+'</td>'+players.map(p=>{const result=q.results?.[p.id],correct=!!result?.correct,powers=(result?.powers||[]).join(', ');return '<td class="'+(correct?'yes':'no')+'">'+(correct?'Yes':'No')+(powers?' ('+escapeHtml(powers)+')':'')+'</td>'}).join('')+'</tr>').join('');$('empty').hidden=entries.length>0}
function authorize(){if(!credentials)return;socket.emit('questionLogJoin',credentials,r=>{$('status').textContent=r?.ok?'HOST ONLY · LIVE':r?.error||'Connection failed'})}socket.on('connect',authorize);socket.on('disconnect',()=>{$('status').textContent='Reconnecting…'});socket.on('questionLogState',render);window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.type!=='quickShotQuestionLogAuth')return;credentials={code:e.data.code,token:e.data.token};if(!socket.connected)socket.connect();else authorize()});if(window.opener){const ask=()=>window.opener?.postMessage({type:'quickShotQuestionLogReady'},location.origin);ask();const retry=setInterval(()=>{if(credentials||window.opener?.closed)clearInterval(retry);else ask()},800);setTimeout(()=>clearInterval(retry),15000)}else $('status').textContent='Open from the host screen';
</script></body></html>
