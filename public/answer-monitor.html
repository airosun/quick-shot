<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quick Shot — Host Answer Monitor</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px;background:#111;color:#f5f5f5;font:16px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #444;padding-bottom:14px}h1{font-size:20px;margin:0}#status{color:#b4b4b4;font-size:13px}#id{color:#aaa;margin:22px 0 8px}#question{font-size:22px;font-weight:650;line-height:1.4;white-space:pre-wrap}#answerPanel{margin-top:22px;background:#153b2a;border:1px solid #3e9a6a;border-radius:14px;padding:20px}#answerLabel{font-size:12px;font-weight:800;letter-spacing:.12em;color:#a1eec4}#answer{font-size:30px;font-weight:800;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:9px}#image{max-width:100%;max-height:220px;object-fit:contain;margin-top:14px;border-radius:10px}#empty{color:#aaa;margin-top:32px}small{color:#888} .hidden{display:none!important}</style></head><body><header><h1>🎯 Quick Shot — Answer Monitor</h1><span id="status">Connecting…</span></header><div id="content" class="hidden"><div id="id"></div><div id="question"></div><img id="image" class="hidden" alt="Question image"><div id="answerPanel"><div id="answerLabel">CORRECT ANSWER · HOST ONLY</div><div id="answer"></div></div></div><p id="empty">Waiting for the next question…</p><small>Move this window to your private screen. Do not share it with players.</small><script src="/socket.io/socket.io.js"></script><script>
const socket=io({autoConnect:false});let credentials=null;
const $=id=>document.getElementById(id);
function render(s){const active=['question','reveal'].includes(s.phase)&&s.answer!==null;$('content').classList.toggle('hidden',!active);$('empty').classList.toggle('hidden',active);$('empty').textContent=s.phase==='lobby'?'Waiting for the game to start…':'Waiting for the next question…';if(!active)return;$('id').textContent='QUESTION '+s.id;$('question').textContent=s.question;$('answer').textContent=s.answer;const im=$('image');if(s.image&&/^https?:\/\//i.test(s.image)){im.src=s.image;im.classList.remove('hidden')}else{im.removeAttribute('src');im.classList.add('hidden')}}
function authorize(){if(!credentials)return;socket.emit('answerMonitorJoin',credentials,r=>{$('status').textContent=r?.ok?'HOST ONLY · LIVE':(r?.error||'Connection failed');if(!r?.ok){$('content').classList.add('hidden');$('empty').textContent='Reconnect from the host page.';$('empty').classList.remove('hidden')}})}
socket.on('connect',authorize);socket.on('disconnect',()=>{$('status').textContent='Reconnecting…';$('content').classList.add('hidden')});socket.on('answerMonitorState',render);
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.opener||e.data?.type!=='quickShotAnswerMonitorAuth')return;credentials={code:e.data.code,token:e.data.token};if(!socket.connected)socket.connect();else authorize()});
if(window.opener){const ask=()=>window.opener?.postMessage({type:'quickShotAnswerMonitorReady'},location.origin);ask();const retry=setInterval(()=>{if(credentials||window.opener?.closed){clearInterval(retry);return}ask()},800);setTimeout(()=>clearInterval(retry),15000)}else{$('status').textContent='Open from the host screen'}
</script></body></html>
